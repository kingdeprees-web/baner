:root{
  --bg:#eef3f9;--card:#fff;--ink:#16263d;--muted:#5d6f88;--line:#d5e0ee;
  --brand:#2563c9;--brand2:#1d4fa3;--soft:#e6f0ff;--ok:#12805c;--danger:#c2362e;
  --shadow:0 6px 24px rgba(22,38,61,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'BNazanin','Tahoma',sans-serif;font-size:18px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg{width:1.15em;height:1.15em;flex:none}

/* ---------- lock ---------- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 500px at 80% -10%,#cfe0ff 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#d8f1ea 0,transparent 55%),var(--bg)}
.lockbox{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:34px 28px;text-align:center}
.lockico{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#5b9bff);display:grid;place-items:center;color:#fff}
.lockico svg{width:34px;height:34px}
.lockbox h1{margin:0 0 4px;font-size:26px}
.lockbox p{margin:0 0 20px;color:var(--muted);font-size:16px}
.pw{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#f8fbff;text-align:center;direction:ltr;letter-spacing:1px;outline:none;font-size:19px}
.pw:focus{border-color:var(--brand);background:#fff}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 18px;color:var(--muted);font-size:16px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:10px 18px;font-weight:bold;transition:.15s transform,.15s box-shadow,.15s background;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(37,99,201,.28)}
.btn.primary:hover{box-shadow:0 8px 20px rgba(37,99,201,.38)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft);border-color:#b7cff5}
.btn.green{background:linear-gradient(135deg,#17a37a,#0e7c5b);color:#fff;box-shadow:0 6px 16px rgba(18,128,92,.25)}
.btn.danger{background:var(--danger);color:#fff}
.btn.wide{width:100%;padding:13px}
.err{color:var(--danger);min-height:24px;margin-top:12px;font-size:16px}

/* ---------- app ---------- */
#app{display:none;min-height:100vh;padding:18px}
.top{max-width:1700px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand .lockico{width:46px;height:46px;border-radius:14px;margin:0}
.brand .lockico svg{width:24px;height:24px}
.brand b{font-size:22px;display:block}
.brand small{color:var(--muted);font-size:14px}
.panel{max-width:1700px;margin:0 auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.selwrap{position:relative;min-width:270px;flex:1 1 270px;max-width:380px}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;padding:11px 16px 11px 44px;border:2px solid var(--line);border-radius:14px;background:#f8fbff;font-weight:bold;outline:none;cursor:pointer}
.selwrap select:focus{border-color:var(--brand)}
.selwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--brand)}
.search{position:relative;flex:1 1 200px;max-width:340px}
.search input{width:100%;padding:11px 42px 11px 14px;border:2px solid var(--line);border-radius:14px;background:#f8fbff;outline:none}
.search input:focus{border-color:var(--brand);background:#fff}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.spacer{flex:1}
.printbtn{padding:11px 22px;font-size:19px;background:linear-gradient(135deg,#ff8a3d,#f0561d);color:#fff;box-shadow:0 8px 20px rgba(240,86,29,.32)}
.printbtn:hover{box-shadow:0 10px 24px rgba(240,86,29,.42);transform:translateY(-1px)}
.count{color:var(--muted);font-size:15px;padding:0 4px}

.tablewrap{overflow:auto;max-height:calc(100vh - 230px);border:1.5px solid var(--line);border-radius:14px}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid #dbe6f3;border-left:1px solid #dbe6f3;text-align:center;vertical-align:middle;font-weight:bold;font-size:16px;line-height:1.55}
.grid th{position:sticky;top:0;background:#bdd7ee;z-index:2;white-space:normal;border-bottom:1.5px solid #9dc3e6}
.grid tbody tr:nth-child(odd) td{background:#ddebf7}
.grid tbody tr:nth-child(even) td{background:#fff}
.grid tbody tr:hover td{background:#fff4c9}
.grid td{white-space:normal;word-break:break-word}
.grid td.act,.grid th.act{position:sticky;left:0;z-index:1;white-space:nowrap;min-width:92px;border-left:0;border-right:1.5px solid #9dc3e6;box-shadow:2px 0 6px rgba(0,0,0,.05)}
.grid th.act{z-index:3}
.ib{border:0;background:#fff;border-radius:9px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ib.del{color:var(--danger)}
.ib:hover{background:var(--soft)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(15,28,48,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.mback.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:980px;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.sm{max-width:420px}
.mh{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--brand),#4a8cf0);color:#fff}
.mh b{font-size:21px}
.mh button{background:rgba(255,255,255,.2);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1}
.mb{padding:18px 20px;overflow:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.fld label{display:block;font-size:15px;color:var(--muted);margin-bottom:4px;font-weight:bold}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#f8fbff;outline:none;font-weight:bold}
.fld input:focus,.fld textarea:focus{border-color:var(--brand);background:#fff}
.fld.full{grid-column:1/-1}
.fld textarea{min-height:68px;resize:vertical}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;background:#f8fbff}
.mf .btn{min-width:130px}
.cmsg{padding:24px 22px;text-align:center;font-size:19px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:#16263d;color:#fff;padding:12px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok::before{content:'✓ ';color:#6ee7b7}

#printArea{display:none}

@media (max-width:700px){
  #app{padding:10px}.panel{padding:10px;border-radius:16px}
  .selwrap,.search{max-width:none}
  .tablewrap{max-height:calc(100vh - 300px)}
  .btn{padding:10px 14px}
  .mf .btn{flex:1;min-width:0}
}

/* ---------- print ---------- */
@media print{
  html,body{background:#fff!important}
  #lock,#app,.mback,.toast{display:none!important}
  #printArea{display:block!important}
  #printArea table{width:100%;border-collapse:collapse;table-layout:fixed;direction:rtl}
  #printArea thead{display:table-header-group}
  #printArea tr{page-break-inside:avoid;break-inside:avoid}
  #printArea th,#printArea td{border:.5pt solid #333;padding:1.2mm .8mm;text-align:center;vertical-align:middle;font-weight:bold;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
  #printArea th{background:#dfe8f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

      <button class="btn ghost" id="btnLock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>قفل</button>

    </div>
  </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="جستجو در جدول…">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>

const ORDER = ['meeting','legal','real'];
const STORE_KEY = 'vault_v1';
const PW_KEY = 'pw_remember_v1';
let KEY = null;              // CryptoKey (memory only)
let STATE = {};              // key -> rows[]
let cur = 'meeting';
let editIdx = null;          // null = new row (append) ; number = row index

/* =====================  CRYPTO  ===================== */
const b64e = u8 => { let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encJSON(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, KEY, new TextEncoder().encode(JSON.stringify(obj))));
  return {iv:b64e(iv), ct:b64e(ct)};
}
async function decJSON(p){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(p.iv)}, KEY, b64d(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* =====================  UNLOCK  ===================== */
async function tryUnlock(pw){
  KEY = await deriveKey(pw.trim());
  let base;
  try { base = await decJSON(VAULT.data); } catch(e){ KEY=null; return false; }
  let state = base;
  const saved = localStorage.getItem(STORE_KEY);
  if(saved){
    try { const s = await decJSON(JSON.parse(saved)); if(s && s.meeting && s.legal && s.real) state = s; } catch(e){}
  }
  STATE = state;
  return true;
}
document.getElementById('lockForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('lockErr'); err.textContent='';
  if(!pw.trim()){ err.textContent='رمز را وارد کنید'; return; }
  const btn = document.getElementById('unlockBtn'); btn.disabled=true; btn.textContent='در حال بررسی…';
  const ok = await tryUnlock(pw);
  btn.disabled=false; btn.textContent='ورود';
  if(!ok){ err.textContent='رمز اشتباه است'; return; }
  if(document.getElementById('remember').checked) localStorage.setItem(PW_KEY, pw.trim()); else localStorage.removeItem(PW_KEY);
  enterApp();
});
async function autoUnlock(){
  const pw = localStorage.getItem(PW_KEY);
  if(!pw) return;
  document.getElementById('remember').checked = true;
  if(await tryUnlock(pw)) enterApp(); else localStorage.removeItem(PW_KEY);
}
function enterApp(){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('pw').value='';
  initUI(); render();
}
document.getElementById('btnLock').onclick = ()=>{
  localStorage.removeItem(PW_KEY); KEY=null; STATE={};
  document.getElementById('app').style.display='none';
  document.getElementById('lock').style.display='flex';
  document.getElementById('remember').checked=false;
  document.getElementById('pw').focus();
};

/* =====================  HELPERS  ===================== */
const $ = id => document.getElementById(id);
const colLetter = n => { let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; };
const letterIdx = L => { let n=0; for(const ch of L) n=n*26+ch.charCodeAt(0)-64; return n-1; };
function show(v, col){
  if(v===null||v===undefined) return '';
  if(typeof v==='number' && col.pad) return String(v).padStart(col.pad,'0');
  return String(v);
}
function norm(s){
  return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,'').toLowerCase();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.className='toast ok show'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='toast',2300); }
async function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(await encJSON(STATE))); }
  catch(e){ alert('ذخیره روی این دستگاه انجام نشد. لطفاً از دکمهٔ «پشتیبان» نسخهٔ پشتیبان بگیرید.'); }
}
function visibleRows(){
  const rows = STATE[cur], q = norm($('q').value||'');
  const out = [];
  rows.forEach((r,i)=>{ if(!q || r.some(v=>v!==null && norm(show(v,{pad:0})).includes(q)) || r.some((v,k)=>v!==null && norm(show(v,META[cur].cols[k])).includes(q))) out.push(i); });
  return out;
}

/* =====================  UI  ===================== */
function initUI(){
  const sel = $('fileSel');
  sel.innerHTML = ORDER.map(k=>`<option value="${k}">${esc(META[k].label)}</option>`).join('');
  sel.value = cur;
  sel.onchange = ()=>{ cur = sel.value; $('q').value=''; render(); };
  $('q').oninput = render;
  $('btnAdd').onclick = openAdd;
  $('btnPrint').onclick = doPrint;
  $('btnXlsx').onclick = doXlsx;
  $('btnBackup').onclick = doBackup;
  $('btnRestore').onclick = ()=>$('restoreFile').click();
  $('restoreFile').onchange = doRestore;
  $('mClose').onclick = $('mCancel').onclick = closeForm;
  $('mForm').addEventListener('mousedown', e=>{ if(e.target===$('mForm')) closeForm(); });
  $('rowForm').onsubmit = saveRow;
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeForm(); $('mConfirm').classList.remove('show'); } });
}
function render(){
  const m = META[cur];
  $('addLbl').textContent = m.addLabel;
  const idx = visibleRows();
  $('count').textContent = idx.length + ' ردیف' + (idx.length!==STATE[cur].length ? ' از ' + STATE[cur].length : '');
  let h = '<thead><tr>' + m.cols.map(c=>`<th style="min-width:${Math.max(64,Math.min(c.w*6.4,250))}px">${esc(String(c.name).trim())}</th>`).join('') + '<th class="act">عملیات</th></tr></thead><tbody>';
  if(!idx.length) h += `<tr><td colspan="${m.cols.length+1}" class="empty">موردی یافت نشد</td></tr>`;
  idx.forEach(i=>{
    const r = STATE[cur][i];
    h += '<tr>' + r.map((v,k)=>`<td>${esc(show(v,m.cols[k]))}</td>`).join('') +
      `<td class="act"><button class="ib" title="ویرایش" data-e="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button> <button class="ib del" title="حذف" data-d="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg></button></td></tr>`;
  });
  $('grid').innerHTML = h + '</tbody>';
  $('grid').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openEdit(+b.dataset.e));
  $('grid').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>askDelete(+b.dataset.d));
}

/* ---------- add / edit ---------- */
function isBlankRow(r){ return r.slice(1).every(v=>v===null||v===undefined||String(v).trim()===''); }
function nextNumber(rows){
  const m = META[cur];
  const vals = rows.map(r=>r[0]).filter(v=>v!==null&&v!=='');
  if(!vals.length) return '';
  const last = vals[vals.length-1];
  if(typeof last==='number'){
    const mx = Math.max(...vals.filter(v=>typeof v==='number'));
    return String(mx+1);
  }
  const mt = String(last).match(/^(.*?)(\d+)$/);
  return mt ? mt[1] + String(+mt[2]+1) : '';
}
function openAdd(){
  const rows = STATE[cur];
  // first row of the trailing block that only has a number in col A -> fill it
  let t = rows.length;
  while(t>0 && isBlankRow(rows[t-1]) && rows[t-1][0]!==null) t--;
  if(t<rows.length) openForm(t, rows[t].slice());
  else { const r = META[cur].cols.map(()=>null); r[0] = nextNumber(rows) || null; openForm(null, r); }
}
function openEdit(i){ openForm(i, STATE[cur][i].slice()); }
function openForm(i, vals){
  editIdx = i;
  const m = META[cur];
  $('mTitle').textContent = (i===null ? m.addLabel : (isBlankRow(STATE[cur][i]) ? m.addLabel : 'ویرایش ردیف'));
  $('mSave').textContent = m.saveLabel;
  // datalists
  const dvByIdx = {}; (m.dv||[]).forEach(d=>dvByIdx[letterIdx(d.col)] = d.vals.filter(v=>v!==null));
  let h='';
  m.cols.forEach((c,k)=>{
    const v = vals[k]===null||vals[k]===undefined ? '' : String(vals[k]);
    const full = c.w>=40;
    const lid = dvByIdx[k] ? `dl_${k}` : '';
    h += `<div class="fld ${full?'full':''}"><label for="f${k}">${esc(String(c.name).trim())}</label>` +
      (full ? `<textarea id="f${k}" data-k="${k}">${esc(v)}</textarea>`
            : `<input id="f${k}" data-k="${k}" value="${esc(v)}" ${lid?`list="${lid}"`:''}>`) + '</div>';
    if(lid) h += `<datalist id="${lid}">${dvByIdx[k].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  });
  $('fields').innerHTML = h;
  $('mForm').classList.add('show');
  setTimeout(()=>{ const f=$('fields').querySelector('input,textarea'); const first = $('fields').querySelector('[data-k="1"]'); (i===null||isBlankRow(STATE[cur][i])?first:f)?.focus(); },60);
}
function closeForm(){ $('mForm').classList.remove('show'); }
function conv(s){
  s = s.trim(); if(s==='') return null;
  if(/^[1-9]\d{0,14}$/.test(s)) return Number(s);
  return s;
}
async function saveRow(ev){
  ev.preventDefault();
  const m = META[cur];
  const row = m.cols.map((c,k)=>{ const el=$('fields').querySelector(`[data-k="${k}"]`); return conv(el.value); });
  if(row.slice(1).every(v=>v===null)){ alert('حداقل یک فیلد را پر کنید.'); return; }
  if(editIdx===null) STATE[cur].push(row); else STATE[cur][editIdx] = row;
  await persist();
  closeForm(); render();
  toast('ذخیره شد');
  if(editIdx===null){ const w=document.querySelector('.tablewrap'); w.scrollTop=w.scrollHeight; }
}
function askDelete(i){
  const r = STATE[cur][i];
  $('cMsg').textContent = `ردیف «${show(r[0],META[cur].cols[0])}» حذف شود؟`;
  $('mConfirm').classList.add('show');
  $('cOk').onclick = async ()=>{ STATE[cur].splice(i,1); await persist(); $('mConfirm').classList.remove('show'); render(); toast('حذف شد'); };
  $('cNo').onclick = $('cClose').onclick = ()=>$('mConfirm').classList.remove('show');
}

/* =====================  PRINT  ===================== */
function doPrint(){
  const m = META[cur], idx = visibleRows();
  if(!idx.length){ alert('ردیفی برای چاپ وجود ندارد.'); return; }
  const wts = m.printW || m.cols.map(c=>Math.pow(Math.max(c.w,7), m.printPow));
  const tot = wts.reduce((a,b)=>a+b,0);
  let h = `<table style="font-size:${m.printFont}pt"><colgroup>${wts.map(w=>`<col style="width:${(w/tot*100).toFixed(3)}%">`).join('')}</colgroup>`;
  h += '<thead><tr>' + m.cols.map(c=>`<th>${esc(String(c.name).trim())}</th>`).join('') + '</tr></thead><tbody>';
  idx.forEach(i=>{ h += '<tr>' + STATE[cur][i].map((v,k)=>`<td>${esc(show(v,m.cols[k]))}</td>`).join('') + '</tr>'; });
  $('printArea').innerHTML = h + '</tbody></table>';
  let st = $('pageStyle'); if(!st){ st=document.createElement('style'); st.id='pageStyle'; document.head.appendChild(st); }
  st.textContent = `@page{size:A4 ${m.orient};margin:${m.margin}mm}`;
  setTimeout(()=>window.print(), 80);
}
window.addEventListener('afterprint', ()=>{ $('printArea').innerHTML=''; });

/* =====================  EXCEL (no libraries)  ===================== */
const crcT = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = crcT[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc = new TextEncoder(); const chunks=[]; const central=[]; let off=0;
  const w16=(a,v)=>a.push(v&255,(v>>8)&255), w32=(a,v)=>a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255);
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const lh=[]; w32(lh,0x04034b50); w16(lh,20); w16(lh,0x0800); w16(lh,0); w16(lh,0); w16(lh,0x21); w32(lh,crc); w32(lh,data.length); w32(lh,data.length); w16(lh,name.length); w16(lh,0);
    chunks.push(new Uint8Array(lh), name, data);
    const ch=[]; w32(ch,0x02014b50); w16(ch,20); w16(ch,20); w16(ch,0x0800); w16(ch,0); w16(ch,0); w16(ch,0x21); w32(ch,crc); w32(ch,data.length); w32(ch,data.length); w16(ch,name.length); w16(ch,0); w16(ch,0); w16(ch,0); w16(ch,0); w32(ch,0); w32(ch,off);
    central.push(new Uint8Array(ch), name);
    off += lh.length + name.length + data.length;
  });
  let csize=0; central.forEach(c=>csize+=c.length);
  const end=[]; w32(end,0x06054b50); w16(end,0); w16(end,0); w16(end,files.length); w16(end,files.length); w32(end,csize); w32(end,off); w16(end,0);
  return new Blob([...chunks, ...central, new Uint8Array(end)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function buildXlsx(key){
  const m = META[key], rows = STATE[key], hdr = m.hdr, nc = m.cols.length;
  const fs = m.xlsxFont;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="00000000000"/></numFmts>
<fonts count="2"><font><sz val="11"/><color rgb="FF000000"/><name val="B Nazanin"/><charset val="178"/></font><font><b/><sz val="${fs}"/><color rgb="FF000000"/><name val="B Nazanin"/><charset val="178"/></font></fonts>
<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFBDD7EE"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF9DC3E6"/></left><right style="thin"><color rgb="FF9DC3E6"/></right><top style="thin"><color rgb="FF9DC3E6"/></top><bottom style="thin"><color rgb="FF9DC3E6"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="6">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="164" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="164" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  const cell = (r,c,v,s)=>{
    const ref = colLetter(c)+r;
    if(v===null||v===undefined||v==='') return `<c r="${ref}" s="${s}"/>`;
    if(typeof v==='number') return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
    return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  };
  const map = {};   // row -> {col: xml}
  const put = (r,c,xml)=>{ (map[r]=map[r]||{})[c]=xml; };
  m.cols.forEach((c,k)=>put(hdr,k,cell(hdr,k,c.name,1)));
  rows.forEach((row,i)=>{
    const r = hdr+1+i, band = i%2===0;
    row.forEach((v,k)=>{
      const pad = m.cols[k].pad && typeof v==='number';
      put(r,k,cell(r,k,v, pad ? (band?4:5) : (band?2:3)));
    });
  });
  Object.entries(m.helpers||{}).forEach(([coord,v])=>{
    const mm = coord.match(/^([A-Z]+)(\d+)$/); const c=letterIdx(mm[1]), r=+mm[2];
    put(r,c,cell(r,c,v,0));
  });
  const lastRow = Math.max(...Object.keys(map).map(Number));
  let sd='';
  for(let r=1;r<=lastRow;r++){
    if(!map[r]){ continue; }
    const cs = Object.keys(map[r]).map(Number).sort((a,b)=>a-b).map(c=>map[r][c]).join('');
    sd += `<row r="${r}">${cs}</row>`;
  }
  const colsXml = '<cols>' + m.cols.map((c,k)=>`<col min="${k+1}" max="${k+1}" width="${c.w}" customWidth="1"/>`).join('') + '</cols>';
  let dv = '';
  if((m.dv||[]).length){
    dv = `<dataValidations count="${m.dv.length}">` + m.dv.map(d=>`<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="0" sqref="${d.col}${hdr+1}:${d.col}5000"><formula1>${d.f.replace(/([A-Z]+)(\d+)/g,'$$$1$$$2')}</formula1></dataValidation>`).join('') + '</dataValidations>';
  }
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${colLetter(Math.max(nc-1,...Object.values(map).flatMap(o=>Object.keys(o).map(Number))))}${lastRow}"/><sheetViews><sheetView rightToLeft="1" tabSelected="1" workbookViewId="0"${m.zoom?` zoomScale="${m.zoom}" zoomScaleNormal="${m.zoom}"`:''}/></sheetViews><sheetFormatPr defaultRowHeight="${m.rowH}"/>${colsXml}<sheetData>${sd}</sheetData><autoFilter ref="A${hdr}:${colLetter(nc-1)}${hdr+rows.length}"/>${dv}<pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="landscape" fitToHeight="0"/></worksheet>`;
  const wb = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="28800" windowHeight="12000"/></bookViews><sheets><sheet name="${m.sheet}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">${m.sheet}!$A$${hdr}:$${colLetter(nc-1)}$${hdr+rows.length}</definedName><definedName name="_xlnm.Print_Titles" localSheetId="0">${m.sheet}!$${hdr}:$${hdr}</definedName></definedNames></workbook>`;
  const files = [
    {name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data:wb},
    {name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:styles},
    {name:'xl/worksheets/sheet1.xml', data:sheet}
  ];
  return zipStore(files);
}
function download(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1500);
}
function doXlsx(){ download(buildXlsx(cur), META[cur].fileName + '.xlsx'); toast('فایل اکسل ساخته شد'); }

/* =====================  BACKUP  ===================== */
function doBackup(){
  const d = new Date(); const stamp = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  download(new Blob([JSON.stringify({app:'sabt-v1', data:STATE})], {type:'application/json'}), 'پشتیبان-'+stamp+'.json');
  toast('نسخهٔ پشتیبان دریافت شد');
}
function doRestore(ev){
  const f = ev.target.files[0]; ev.target.value=''; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const j = JSON.parse(rd.result);
      if(j.app!=='sabt-v1' || !j.data || !ORDER.every(k=>Array.isArray(j.data[k]))) throw 0;
      $('cMsg').textContent = 'اطلاعات فعلی با نسخهٔ پشتیبان جایگزین شود؟';
      $('mConfirm').classList.add('show');
      $('cOk').onclick = async ()=>{ STATE=j.data; await persist(); $('mConfirm').classList.remove('show'); render(); toast('بازیابی شد'); };
      $('cNo').onclick = $('cClose').onclick = ()=>$('mConfirm').classList.remove('show');
    }catch(e){ alert('این فایل، نسخهٔ پشتیبان معتبر نیست.'); }
  };
  rd.readAsText(f);
}

autoUnlock();
